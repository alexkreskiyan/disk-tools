[package]
name = "disk-tools-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
rayon = "1.12.0"
# Detection rules are globs now, and this is the crate ripgrep matches paths
# with: many patterns compile into **one** automaton, which is what keeps the
# per-node cost inside the 285 ns budget the hardcoded matcher used to spend.
# `default-features = false` drops its `log` feature — this crate never logs.
globset = { version = "0.4.19", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
# Deletions go to the OS trash, never `rm` — an unrecoverable mistake is not an
# acceptable failure mode for a cleanup tool. Pulls only `objc2` on macOS and
# `windows` on Windows; no dbus or portal, so headless CI works.
trash = { version = "5.2", optional = true }

# `serde`: opt-in serialization of the scan model, enabled by the CLI for `--json`.
#
# `trash`: the ability to actually remove something. On by default so `cargo test`
# exercises it without ceremony; without it a consumer still gets `scan()` **and**
# `plan()` — deciding what to delete needs nothing from the backend — and stops
# compiling `objc2` / `windows` for a capability it never calls.
#
# `just check-minimal` keeps that promise honest; nothing else exercises this
# configuration.
[features]
default = ["trash"]
trash = ["dep:trash"]
serde = ["dep:serde"]

# Windows hides allocated size from `std::fs::Metadata`; `GetCompressedFileSizeW`
# is the only way to it. Unix builds stay dependency-free.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
