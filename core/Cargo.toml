[package]
name = "disk-tools-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
rayon = "1.12.0"
serde = { version = "1", features = ["derive"], optional = true }

# Opt-in serialization of the scan model, enabled by the CLI for `--json`.
# Library consumers that don't need it pay nothing.
[features]
serde = ["dep:serde"]

# Windows hides allocated size from `std::fs::Metadata`; `GetCompressedFileSizeW`
# is the only way to it. Unix builds stay dependency-free.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
