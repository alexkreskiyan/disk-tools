name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref supersedes the running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform, not just the first one to go red.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # MSRV is pinned in Cargo.toml (rust-version = "1.88"); stable satisfies it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The justfile is the single entry point for tooling — CI calls its recipes
      # rather than duplicating the raw cargo commands.
      - uses: extractions/setup-just@v4

      # fmt-check + lint + test. Windows needs no privilege setup: the symlink,
      # hardlink, sparse-file and permission fixtures are all #[cfg(unix)], and
      # the mount-point test is #[ignore].
      - name: just verify
        run: just verify

      - name: just build
        run: just build

      # Moves real files into the runner's trash — safe on an ephemeral VM, and
      # the only way to learn what each platform's backend actually does. It also
      # exercises the one path that can still abort a cleanup: `trash` 5.2.6
      # `unwrap()`s CoCreateInstance on its Windows delete path, so a COM-hostile
      # runner surfaces here as a red build rather than as a user's lost run.
      - name: just smoke-trash
        run: just smoke-trash

  # `verify` runs on stable, which happily accepts APIs stabilized after our
  # MSRV — the manifest's `rust-version = "1.88"` would silently become a lie.
  # One Linux job pinned to that exact toolchain keeps it honest.
  #
  # It was 1.85 (the edition-2024 floor) until v0.4: `ratatui` 0.30 needs 1.86
  # and 0.30.2 needs 1.88. Staying would have meant `ratatui` 0.29, a major
  # version behind.
  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - name: just check
        run: just check

  # Branch coverage needs `-Z coverage-options=branch`, which is nightly-only —
  # so this job cannot gate a merge without pinning the project to nightly.
  # It reports and does not block: line coverage (which `verify` can measure
  # anywhere) hides exactly the case that matters here, a condition whose two
  # arms are both on the same line.
  coverage:
    name: branch coverage (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: extractions/setup-just@v4
      - name: just coverage-branch
        run: just coverage-branch
