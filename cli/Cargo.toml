[package]
name = "disk-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "disk-tools"
path = "src/main.rs"

[dependencies]
disk-tools-core = { path = "../core", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
terminal_size = "0.4"
serde_json = "1"
indicatif = "0.17"
# Terminal column widths: CJK and emoji occupy two columns, combining marks
# none, so the tree's right-edge alignment cannot be computed from char counts.
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
