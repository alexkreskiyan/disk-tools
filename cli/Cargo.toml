[package]
name = "disk-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "disk-tools"
path = "src/main.rs"

[dependencies]
disk-tools-core = { path = "../core" }
clap = { version = "4.5", features = ["derive"] }
terminal_size = "0.4"

[dev-dependencies]
tempfile = "3"
