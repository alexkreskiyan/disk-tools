[package]
name = "disk-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "disk-tools"
path = "src/main.rs"

[dependencies]
disk-tools-core = { path = "../core", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
terminal_size = "0.4"
serde_json = "1"
# The config file. `serde_yaml` was archived in 2024; this is the fork the YAML
# organisation maintains, and it is a plain serde data format, so `serde_ignored`
# still sees the unknown keys.
yaml_serde = "0.10"
serde = { version = "1", features = ["derive"] }
# Unknown keys are a warning, not an error, and this reports their exact dotted
# path without a second description of the schema that could drift from the
# first.
serde_ignored = "0.1"
indicatif = "0.17"
# The TUI. Sets the workspace MSRV: 0.30 needs 1.86, 0.30.2 needs 1.88.
ratatui = "0.30.2"
# Terminal column widths: CJK and emoji occupy two columns, combining marks
# none, so the tree's right-edge alignment cannot be computed from char counts.
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
